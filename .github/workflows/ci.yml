name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecb_user
          POSTGRES_PASSWORD: ecb_password
          POSTGRES_DB: ecb_rates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecb_user -d ecb_rates"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ecb_user:ecb_password@localhost:5432/ecb_rates

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy app/ pipeline/

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov=pipeline --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
