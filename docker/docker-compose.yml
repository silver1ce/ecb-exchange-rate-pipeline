services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecb_user
      POSTGRES_PASSWORD: ecb_password
      POSTGRES_DB: ecb_rates
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecb_user -d ecb_rates"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: alembic upgrade head
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ecb_user:ecb_password@db:5432/ecb_rates
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ecb_user:ecb_password@db:5432/ecb_rates
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
